services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "8080:8080"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=scooters
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    depends_on:
      db:
        condition: service_healthy
    networks:
      - scooter-net

  db:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_DB=scooters
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scooters"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - scooter-net

volumes:
  db_data:

networks:
  scooter-net: